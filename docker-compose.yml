services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    envirement:
      FIZZBUZZ_MAX_LIMIT: ${FIZZBUZZ_MAX_LIMIT:-10000}
    ports:
      - "${API_PORT:-8080}:8080"
    networks:
      - fizz-buzz-network

networks:
  fizz-buzz-network:
    driver: bridge
